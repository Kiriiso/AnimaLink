spring.application.name=inventory_service
server.port=8087
spring.datasource.url=jdbc:mysql://mysql:3306/vet_inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.service-url.defaultZone=http://auth_service:8081/eureka/
eureka.instance.prefer-ip-address=false
