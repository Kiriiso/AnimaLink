spring.application.name=gate-way
server.port=8080

# ====== API GATEWAY (Spring Cloud Gateway MVC) ======
# Punto de entrada unico. Enruta hacia cada microservicio segun la ruta.
# El patron /api/*/recurso/** cubre tanto /api/v1/... como /api/v2/...
# Las URIs usan variables de entorno (con default localhost) para funcionar
# tanto en LOCAL como en DOCKER (donde apuntan a los nombres de contenedor).

# auth_service (8081)
spring.cloud.gateway.server.webmvc.routes[0].id=auth_service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/*/auth/**

