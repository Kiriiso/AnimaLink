# Perfil TEST: base de datos H2 EN MEMORIA (no requiere MySQL).
# Se usa al ejecutar 'mvnw test' y para pruebas rapidas sin levantar la BD real.
spring.datasource.url=jdbc:h2:mem:animalink_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
