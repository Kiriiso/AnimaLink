spring.application.name=api-gateway
server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/vet_api_gateway_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.service-url.defaultZone=http://auth_service:8081/eureka/
eureka.instance.prefer-ip-address=false
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=cliente-service
spring.cloud.gateway.routes[0].uri=lb://cliente_service
spring.cloud.gateway.routes[0].predicates=Path=/clientes/**
spring.cloud.gateway.routes[1].id=pets-service
spring.cloud.gateway.routes[1].uri=lb://pets_service
spring.cloud.gateway.routes[1].predicates=Path=/pets/**
spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://appointment_service
spring.cloud.gateway.routes[2].predicates=Path=/appointments/**
spring.cloud.gateway.routes[3].id=factura-service
spring.cloud.gateway.routes[3].uri=lb://factura_service
spring.cloud.gateway.routes[3].predicates=Path=/facturas/**
spring.cloud.gateway.routes[4].id=inventory-service
spring.cloud.gateway.routes[4].uri=lb://inventory_service
spring.cloud.gateway.routes[4].predicates=Path=/inventory/**
spring.cloud.gateway.routes[5].id=notifications-service
spring.cloud.gateway.routes[5].uri=lb://notifications_service
spring.cloud.gateway.routes[5].predicates=Path=/notifications/**
spring.cloud.gateway.routes[6].id=users-service
spring.cloud.gateway.routes[6].uri=lb://users_service
spring.cloud.gateway.routes[6].predicates=Path=/users/**
spring.cloud.gateway.routes[7].id=auth-service
spring.cloud.gateway.routes[7].uri=lb://auth_service
spring.cloud.gateway.routes[7].predicates=Path=/auth/**
spring.cloud.gateway.routes[8].id=cliente-service-alias
spring.cloud.gateway.routes[8].uri=lb://cliente_service
spring.cloud.gateway.routes[8].predicates=Path=/clientes/**
spring.cloud.gateway.routes[9].id=medical-record-service
spring.cloud.gateway.routes[9].uri=lb://medical_record_service
spring.cloud.gateway.routes[9].predicates=Path=/medical-records/**
