spring.application.name=cliente_service
server.port=8083

# Perfil activo por defecto (usa application-dev.properties para la base de datos)
spring.profiles.active=dev

# Documentacion OpenAPI / Swagger UI -> http://localhost:8083/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ====== Seguridad JWT (valida el token emitido por auth_service) ======
jwt.secret=122345678912345678912345678912345
app.security.write-roles=ADMIN,RECEPCIONISTA
