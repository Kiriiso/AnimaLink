spring.application.name=cita_service
server.port=8085

spring.profiles.active=dev

# URLs de los microservicios que consulta (comunicacion via WebClient)
services.mascota.url=http://localhost:8084
services.usuario.url=http://localhost:8082

# Documentacion OpenAPI / Swagger UI -> http://localhost:8085/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ====== Seguridad JWT (valida el token emitido por auth_service) ======
jwt.secret=122345678912345678912345678912345
app.security.write-roles=ADMIN,VETERINARIO,RECEPCIONISTA
